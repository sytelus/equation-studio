[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bipolar-nebula-rewrite"
version = "1.0.0"
description = "Readable, composable NumPy reconstruction of a supplied mathematical artwork"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[tool.setuptools]
packages = ["nebula"]
